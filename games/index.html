<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Juegos | Tahu De Chill</title>
<style>
:root{--bg:#111;--orange:#ff9000;--line:#303030}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:#f5f5f5;font:15px Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
header{height:68px;background:#080808;border-bottom:1px solid #292929;display:flex;align-items:center;gap:22px;padding:0 clamp(16px,4vw,58px)}
.brand{font-size:25px;font-weight:900;letter-spacing:-1.3px;white-space:nowrap;color:white;text-decoration:none}.brand span{background:var(--orange);color:#111;padding:4px 6px;border-radius:5px;margin-left:2px}
.nav-button{background:var(--orange);color:#111;text-decoration:none;font-weight:800;padding:10px 17px;border-radius:5px}
main{flex:1;display:grid;place-items:center;padding:40px 20px}
.panel{text-align:center;background:linear-gradient(135deg,#21170d,#171717 70%);border:1px solid #493015;border-radius:12px;padding:clamp(35px,7vw,70px);width:min(100%,760px);box-shadow:0 18px 60px #0005}
h1{font-size:clamp(36px,6vw,58px);margin:0 0 24px;font-weight:900}h1 span{color:var(--orange)}
.soon{display:inline-block;color:#ffbd55;font-size:clamp(18px,3vw,23px)}
footer{border-top:1px solid var(--line);padding:20px;text-align:center;color:#777;font-size:12px}
</style>
</head>
<body>
<header><a class="brand" href="../">tahu<span>de chill</span></a><a class="nav-button" href="./">Games</a></header>
<main><section class="panel"><h1><span>Juegos</span></h1><p class="soon">¡Pronto juegos!</p></section></main>
<footer>© 2026 Tahu De Chill</footer>
</body>
</html>
