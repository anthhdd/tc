<title>Juego online | Tahu De Chill</title>
<style>
:root{--bg:#111;--orange:#ff9000;--line:#303030}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:#f5f5f5;font:15px Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
header{min-height:68px;background:#080808;border-bottom:1px solid #292929;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px clamp(16px,4vw,58px)}
.brand{font-size:25px;font-weight:900;letter-spacing:-1.3px;white-space:nowrap;color:white;text-decoration:none}
.brand span{background:var(--orange);color:#111;padding:4px 6px;border-radius:5px;margin-left:2px}
.nav-button{background:var(--orange);color:#111;text-decoration:none;font-weight:800;padding:10px 15px;border-radius:5px}
main{flex:1;display:grid;place-items:center;padding:40px 20px}
.panel{text-align:center;background:linear-gradient(135deg,#21170d,#171717 70%);border:1px solid #493015;border-radius:12px;padding:clamp(35px,7vw,70px);width:min(100%,760px);box-shadow:0 18px 60px #0005}
h1{font-size:clamp(36px,6vw,58px);margin:0 0 18px;font-weight:900}
h1 span{color:var(--orange)}
p{font-size:19px;line-height:1.6;color:#bbb;margin:0}
footer{border-top:1px solid var(--line);padding:20px;text-align:center;color:#777;font-size:12px}
</style>
</head>

<footer>© 2026 Tahu De Chill</footer>

</html>
